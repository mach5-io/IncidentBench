#           sql_file: "incident_timeline.sql"

timeline:
  phases:
    - name: "warmup"
      display_name: "Warm-up"
      duration_seconds: 60
      query:
        target_qps: 2.0
      description: >
        Low-rate warm-up phase. JIT caches and connection pools stabilise.
        Results from this phase are excluded from scorecard calculations.

    - name: "baseline"
      display_name: "Baseline"
      duration_seconds: 180
      query:
        target_qps: 5.0
      description: >
        Steady-state query load at nominal concurrency.
        P99 measured here becomes the baseline for degradation ratios.

    - name: "stress"
      display_name: "Stress"
      duration_seconds: 240
      query:
        target_qps: 10.0
      description: >
        Double the baseline QPS. Measures latency degradation under load
        and whether the gateway / warehouse sustain throughput.

    - name: "recovery"
      display_name: "Recovery"
      duration_seconds: 120
      query:
        target_qps: 5.0
      description: >
        QPS drops back to baseline. Verifies the system returns to nominal
        latency after the stress phase.

valid_run_criteria:
  rules:
    - name: "baseline_p99_under_5s"
      condition: "baseline_p99_ms < 5000"
      message: "Baseline P99 must be under 5 s — system too slow for this benchmark"

    - name: "degradation_ratio"
      condition: "p99_degradation_ratio < 3.0"
      message: "Stress-phase P99 must not exceed 3x baseline"

report:
  title: "Mach5 Query Benchmark Report"
  emphasis:
    - "p99_degradation_ratio"
    - "recovery_time"
