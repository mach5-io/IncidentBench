---
apiVersion: v1
kind: Namespace
metadata:
  name: incidentbench-system
  labels:
    app.kubernetes.io/name: incidentbench-operator
    app.kubernetes.io/part-of: incidentbench

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidentbench-operator
  namespace: incidentbench-system
  labels:
    app.kubernetes.io/name: incidentbench-operator
    app.kubernetes.io/part-of: incidentbench

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentbench-operator
  namespace: incidentbench-system
  labels:
    app.kubernetes.io/name: incidentbench-operator
    app.kubernetes.io/part-of: incidentbench
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incidentbench-operator
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incidentbench-operator
        app.kubernetes.io/part-of: incidentbench
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: incidentbench-operator
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator
          image: OPERATOR_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: "info,incidentbench_operator=debug"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
