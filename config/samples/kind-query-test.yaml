---
# Query-only smoke test from kind cluster against microk8s Mach5.
#
# Fill in 192.168.29.172 with the output of:
#   kubectl get node ramasus -o wide   (INTERNAL-IP column)
#
# mach5-nginx NodePorts (already exposed):
#   HTTP  → 31950
#   PG    → 30685
#
# There is already a warehouse running:
#   warehouse-ir/md/os with UUID prefix 29887416-dcec-40a6-b87d-a889031585
# Set warehouse.name below to match the name used when that warehouse was created,
# or leave it to let the operator create a new one.

apiVersion: incidentbench.io/v1alpha1
kind: IncidentBenchRun
metadata:
  name: kind-query-test-001
  namespace: incidentbench-system
spec:
  scenario:
    scenario:
      name: "kind-query-test"
      version: "1.0.0"
      display_name: "Kind → Mach5 Query Test"
      description: "Query-only smoke test from kind cluster against microk8s Mach5"
      domain: "sre"

    # No data_streams — query-only, no Kafka or ingest workers created.

    query_mix:
      queries:
        # --- basic-search ---
        - name: "bs-01-all-eur"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT * FROM "opensearch_dashboards_sample_data_ecommerce"
            WHERE currency = 'EUR' LIMIT 25

        - name: "bs-02-high-value"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT order_id, customer_full_name, taxful_total_price
            FROM "opensearch_dashboards_sample_data_ecommerce"
            WHERE taxful_total_price > 100 LIMIT 25

        - name: "bs-03-male-customers"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT * FROM "opensearch_dashboards_sample_data_ecommerce"
            WHERE customer_gender = 'MALE' LIMIT 25

        - name: "bs-04-monday-orders"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT order_id, order_date, taxful_total_price
            FROM "opensearch_dashboards_sample_data_ecommerce"
            WHERE day_of_week = 'Monday' ORDER BY taxful_total_price DESC LIMIT 25

        - name: "bs-05-female-high-value"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT order_id, customer_full_name, taxful_total_price
            FROM "opensearch_dashboards_sample_data_ecommerce"
            WHERE customer_gender = 'FEMALE' AND taxful_total_price > 150 LIMIT 25

        - name: "bs-06-low-value"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT count(*) FROM "opensearch_dashboards_sample_data_ecommerce"
            WHERE taxful_total_price < 20

        - name: "bs-07-weekend"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT * FROM "opensearch_dashboards_sample_data_ecommerce"
            WHERE day_of_week IN ('Saturday', 'Sunday') LIMIT 25

        - name: "bs-08-total-count"
          type: "sql"
          category: "basic-search"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT count(*) FROM "opensearch_dashboards_sample_data_ecommerce"

        # --- pie-chart ---
        - name: "pc-04-top-manufacturers"
          type: "sql"
          category: "pie-chart"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT manufacturer, count(*) as cnt
            FROM "opensearch_dashboards_sample_data_ecommerce"
            GROUP BY manufacturer ORDER BY cnt DESC LIMIT 10

        - name: "pc-05-gender-split"
          type: "sql"
          category: "pie-chart"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT customer_gender, count(*), avg(taxful_total_price)
            FROM "opensearch_dashboards_sample_data_ecommerce"
            GROUP BY customer_gender

        - name: "pc-06-revenue-by-day"
          type: "sql"
          category: "pie-chart"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT day_of_week, count(*), sum(taxful_total_price)
            FROM "opensearch_dashboards_sample_data_ecommerce"
            GROUP BY day_of_week ORDER BY sum(taxful_total_price) DESC

        # --- time-series ---
        - name: "ts-01-count-by-currency"
          type: "sql"
          category: "time-series"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT currency, count(*)
            FROM "opensearch_dashboards_sample_data_ecommerce"
            GROUP BY currency

        - name: "ts-02-avg-value-by-day"
          type: "sql"
          category: "time-series"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT day_of_week, avg(taxful_total_price), count(*)
            FROM "opensearch_dashboards_sample_data_ecommerce"
            GROUP BY day_of_week ORDER BY avg(taxful_total_price) DESC

        - name: "ts-03-top-countries"
          type: "sql"
          category: "time-series"
          template: ""
          index: ""
          timeout_ms: 10000
          sql: >-
            SELECT customer_country, count(*), avg(taxful_total_price)
            FROM "opensearch_dashboards_sample_data_ecommerce"
            GROUP BY customer_country ORDER BY count(*) DESC LIMIT 20

    timeline:
      phases:
        - name: "baseline"
          display_name: "Baseline"
          duration_seconds: 60
          query:
            target_qps: 2.0

    valid_run_criteria:
      rules: []

    report:
      title: "Kind Query Test"

  target:
    adapter: "mach5"
    config:
      endpoint: "http://192.168.29.172:31950"   # ← replace 192.168.29.172
      namespace: "default"
      warehouse:
        name: "m1"
        numMediators: 1
        numOs: 1
      pg_host: "192.168.29.172"                 # ← replace 192.168.29.172
      pg_port: 30685
      pg_user: "mach5"
      pg_password: "mach5"
      pg_dbname: "default"

  kafka:
    managed: false
    bootstrap_servers: ""

  workers:
    query:
      replicas: 1

  images:
    worker: "ghcr.io/mach5-io/worker:v0.1.0"
    reporter: "ghcr.io/mach5-io/reporter:v0.1.0"
