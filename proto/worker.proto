syntax = "proto3";

package incidentbench.worker;

// TDigest centroid for mergeable quantile estimation.
message TDigestCentroid {
  double mean = 1;
  int64 count = 2;
}

// Latency distribution using t-digest for distributed merging.
message LatencyDistribution {
  repeated TDigestCentroid centroids = 1;
  int64 count = 2;
  double min = 3;
  double max = 4;
}

// Per-query-type latency breakdown.
message QueryTypeLatency {
  string query_name = 1;
  LatencyDistribution latency = 2;
  int64 executed = 3;
  int64 errors = 4;
}

// A single query that exceeded its timeout during a session tick.
message TimedOutQueryRecord {
  string query_name   = 1;
  string category     = 2;
  string phase        = 3;
  int64  timestamp_ms = 4;
  double duration_ms  = 5;
  int64  timeout_ms   = 6;
}

// Per-second metric snapshot from a single worker.
message WorkerMetricSnapshot {
  // Worker identity
  string worker_id = 1;
  string worker_mode = 2;  // "ingest" or "query"
  int32 worker_index = 3;

  // Timestamp for this 1-second bucket (unix nanoseconds).
  int64 timestamp_ns = 4;

  // Current benchmark phase.
  string phase = 5;

  // Ingest metrics (only populated for ingest workers).
  int64 events_produced = 10;
  int64 events_acknowledged = 11;
  int64 events_failed = 12;
  LatencyDistribution kafka_produce_latency = 13;

  // Query metrics (only populated for query workers).
  int64 queries_executed = 20;
  int64 query_errors = 21;
  LatencyDistribution query_latency = 22;
  repeated QueryTypeLatency query_latency_by_type = 23;

  // Query group this worker belongs to (empty for ingest workers).
  string query_group = 24;

  // System metrics.
  double cpu_utilization = 30;
  int64 memory_bytes = 31;

  // Target rates for this worker.
  int64 target_rate = 40;  // EPS for ingest, milliqps for query
  // Session-mode configured concurrency for this worker; 0 for non-session workers.
  int32 concurrent_sessions = 41;

  // Timed-out queries from this worker (session mode only; empty for rate-controlled workers).
  repeated TimedOutQueryRecord timed_out_queries = 16;
}
