syntax = "proto3";

package incidentbench.phasecontroller;

// The PhaseGate service coordinates phase transitions across all workers
// using a two-phase barrier protocol over bidirectional streaming.
service PhaseGateService {
  // Workers connect via bidirectional streaming. The controller sends
  // phase transition commands; workers send readiness and ack messages.
  rpc PhaseStream(stream WorkerMessage) returns (stream ControllerMessage);

  // One-shot status query from the operator.
  rpc GetStatus(StatusRequest) returns (StatusResponse);
}

// Messages from worker to controller.
message WorkerMessage {
  string worker_id = 1;
  string worker_mode = 2;  // "ingest" or "query"
  int32 worker_index = 3;

  oneof payload {
    WorkerReady ready = 10;
    PrepareAck prepare_ack = 11;
    WorkerDone done = 12;
  }
}

message WorkerReady {}

message PrepareAck {
  string phase = 1;
}

message WorkerDone {}

// Messages from controller to workers.
message ControllerMessage {
  oneof payload {
    PrepareTransition prepare_transition = 10;
    PhaseTransition phase_transition = 11;
    RunComplete run_complete = 12;
  }
}

// Sent ~100ms before phase transition. Workers finish in-flight ops and ack.
message PrepareTransition {
  string from_phase = 1;
  string to_phase = 2;
}

// Sent after all acks received (or timeout). Contains a future timestamp
// for precise synchronized transition.
message PhaseTransition {
  string from_phase = 1;
  string to_phase = 2;
  int64 transition_time_unix_ns = 3;
  int64 new_target_rate = 4;  // Per-worker rate target for the new phase
}

// Sent when the entire timeline is complete.
message RunComplete {}

// Status query.
message StatusRequest {}

message StatusResponse {
  string state = 1;          // "waiting" | "running" | "complete" | "failed"
  string current_phase = 2;
  int64 phase_elapsed_seconds = 3;
  int64 total_elapsed_seconds = 4;
  int64 total_duration_seconds = 5;
  int32 connected_ingest_workers = 6;
  int32 connected_query_workers = 7;
  bool timeline_complete = 8;
}
